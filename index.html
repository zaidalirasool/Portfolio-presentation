<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dev-friendly: ensure refresh picks up latest JS/CSS without hard-reload -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Merchant Stack Map (Interactive)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <main class="main">
        <section class="stageWrap" aria-label="Interactive map">
          <div id="stage" class="stage" tabindex="0" role="application" aria-roledescription="interactive diagram">
            <div id="viewport" class="viewport" aria-hidden="false">
              <svg id="edges" class="edges" aria-hidden="true"></svg>
              <div id="nodes" class="nodes" aria-hidden="false"></div>
            </div>
          </div>
        </section>
      </main>

      <nav class="slideshowPagination" aria-label="Slide pagination" data-slide-count="3">
        <ol class="slideshowPagination__dots" id="slideshowDots"></ol>
      </nav>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
