<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crafting loyalty that delivers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="./styles.css?v=108" />
  </head>
  <body>
    <div class="app">
      <div class="slidesDeck">
        <section
          class="slide slide--intro is-active"
          data-slide-index="0"
          aria-labelledby="intro-title"
        >
          <main class="main">
            <section class="stageWrap stageWrap--intro" aria-label="Introduction">
              <div class="introSlide">
                <h1 class="introSlide__title" id="intro-title">Crafting loyalty that delivers</h1>
              </div>
            </section>
          </main>
        </section>

        <section
          class="slide slide--map"
          data-slide-index="1"
          aria-label="Merchant stack"
          aria-hidden="true"
        >
          <main class="main">
            <div id="mapSlideMount1" class="mapSlideMount">
              <section class="stageWrap" aria-label="Interactive map">
                <div id="stage" class="stage" tabindex="0" role="application" aria-roledescription="interactive diagram">
                  <div id="viewport" class="viewport" aria-hidden="false">
                    <svg id="edges" class="edges" aria-hidden="true"></svg>
                    <div id="nodes" class="nodes" aria-hidden="false"></div>
                  </div>
                </div>
              </section>
            </div>
          </main>
        </section>

        <section
          class="slide slide--map slide--imageOnly"
          data-slide-index="2"
          aria-label="Process and research"
          aria-hidden="true"
        >
          <main class="main">
            <div class="mapSlideMount">
              <section class="stageWrap stageWrap--imageSlide" aria-label="Research collage">
                <div class="imageSlideCanvas">
                  <img
                    src="./assets/slide3-research.png?v=4"
                    alt="Journey mapping, competitive notes, concepts, and checkout flow"
                    class="imageSlideCanvas__img"
                    width="7392"
                    height="4668"
                    draggable="false"
                  />
                </div>
              </section>
            </div>
          </main>
        </section>

        <section
          class="slide slide--map"
          data-slide-index="3"
          aria-label="Merchant map (recap)"
          aria-hidden="true"
        >
          <main class="main">
            <div id="mapSlideMount3" class="mapSlideMount"></div>
          </main>
        </section>
      </div>
    </div>

    <!-- Modal 1: Loyalty connected to Pre-purchase -->
    <div id="loyaltyModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="loyaltyModalTitle" hidden>
      <div class="modal__backdrop"></div>
      <div class="modal__card">
        <div class="modal__body">
          <div class="modal__header">
            <h2 class="modal__title" id="loyaltyModalTitle">The current loyalty framework</h2>
            <button class="modal__close" aria-label="Close">
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <line x1="1" y1="1" x2="10" y2="10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                <line x1="10" y1="1" x2="1" y2="10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <img
            src="./assets/loyalty-tiers.png?v=13"
            alt="Loyalty tier structure: Free, Spend $100, Spend $250, Spend $400"
            class="modal__tableImg"
            width="3632"
            height="2012"
            draggable="false"
          />
        </div>
      </div>
    </div>

    <!-- Modal 2: Loyalty connected to Retention (post-reroute) -->
    <div id="loyaltyModalRerouted" class="modal" role="dialog" aria-modal="true" aria-labelledby="loyaltyModalReroutedTitle" hidden>
      <div class="modal__backdrop"></div>
      <div class="modal__card">
        <div class="modal__body">
          <div class="modal__header">
            <h2 class="modal__title" id="loyaltyModalReroutedTitle">What merchants want</h2>
            <button class="modal__close" aria-label="Close">
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <line x1="1" y1="1" x2="10" y2="10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                <line x1="10" y1="1" x2="1" y2="10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <img
            src="./assets/loyalty-tiers-recharge.png?v=1"
            alt="What merchants want from loyalty"
            class="modal__tableImg"
            width="3632"
            height="2012"
            draggable="false"
          />
        </div>
      </div>
    </div>

    <nav class="slideshowPagination" aria-label="Slide pagination" data-slide-count="4">
      <ol class="slideshowPagination__dots" id="slideshowDots"></ol>
    </nav>

    <script type="module" src="./app.js?v=slideshow-83"></script>
  </body>
</html>
