<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crafting loyalty that delivers</title>
    <link rel="stylesheet" href="./styles.css?v=54" />
  </head>
  <body>
    <div class="app">
      <div class="slidesDeck">
        <section
          class="slide slide--intro is-active"
          data-slide-index="0"
          aria-labelledby="intro-title"
        >
          <main class="main">
            <section class="stageWrap stageWrap--intro" aria-label="Introduction">
              <div class="introSlide">
                <h1 class="introSlide__title" id="intro-title">Crafting loyalty that delivers</h1>
              </div>
            </section>
          </main>
        </section>

        <section
          class="slide slide--map"
          data-slide-index="1"
          aria-label="Merchant stack"
          aria-hidden="true"
        >
          <main class="main">
            <div id="mapSlideMount1" class="mapSlideMount">
              <section class="stageWrap" aria-label="Interactive map">
                <div id="stage" class="stage" tabindex="0" role="application" aria-roledescription="interactive diagram">
                  <div id="viewport" class="viewport" aria-hidden="false">
                    <svg id="edges" class="edges" aria-hidden="true"></svg>
                    <div id="nodes" class="nodes" aria-hidden="false"></div>
                  </div>
                </div>
              </section>
            </div>
          </main>
        </section>

        <section
          class="slide slide--map slide--imageOnly"
          data-slide-index="2"
          aria-label="Process and research"
          aria-hidden="true"
        >
          <main class="main">
            <div class="mapSlideMount">
              <section class="stageWrap stageWrap--imageSlide" aria-label="Research collage">
                <div class="imageSlideCanvas">
                  <img
                    src="./assets/slide3-research.png?v=4"
                    alt="Journey mapping, competitive notes, concepts, and checkout flow"
                    class="imageSlideCanvas__img"
                    width="7392"
                    height="4668"
                    draggable="false"
                  />
                </div>
              </section>
            </div>
          </main>
        </section>
      </div>
    </div>

    <nav class="slideshowPagination" aria-label="Slide pagination" data-slide-count="3">
      <ol class="slideshowPagination__dots" id="slideshowDots"></ol>
    </nav>

    <script type="module" src="./app.js?v=slideshow-34"></script>
  </body>
</html>
